name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: cjmpipelinemcp
          containerAppName: pipeline-mcp
          resourceGroup: pipeline-mcp-rg
          imageToBuild: cjmpipelinemcp.azurecr.io/pipeline-mcp:${{ github.sha }}
          environmentVariables: |
            MCP_API_KEY=${{ secrets.MCP_API_KEY }}
            JOB_PIPELINE_FILE=/mnt/pipeline/pipeline.json

      # container-apps-deploy-action can drop volume mounts; re-apply Azure Files after each deploy.
      - name: Ensure Azure Files mount
        run: |
          IMAGE=$(az containerapp show -n pipeline-mcp -g pipeline-mcp-rg --query "properties.template.containers[0].image" -o tsv)
          cat > /tmp/pipeline-mount.yaml <<EOF
          properties:
            template:
              containers:
              - name: pipeline-mcp
                image: ${IMAGE}
                env:
                - name: MCP_API_KEY
                  value: ${{ secrets.MCP_API_KEY }}
                - name: JOB_PIPELINE_FILE
                  value: /mnt/pipeline/pipeline.json
                resources:
                  cpu: 0.5
                  memory: 1Gi
                volumeMounts:
                - volumeName: pipeline-volume
                  mountPath: /mnt/pipeline
                probes:
                - type: Liveness
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 30
              volumes:
              - name: pipeline-volume
                storageType: AzureFile
                storageName: pipelinefiles
              scale:
                minReplicas: 1
                maxReplicas: 10
          EOF
          az containerapp update -n pipeline-mcp -g pipeline-mcp-rg --yaml /tmp/pipeline-mount.yaml
