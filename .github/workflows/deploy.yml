name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: cjmpipelinemcp
          containerAppName: pipeline-mcp
          resourceGroup: pipeline-mcp-rg
          imageToBuild: cjmpipelinemcp.azurecr.io/pipeline-mcp:${{ github.sha }}
          environmentVariables: MCP_API_KEY=${{ secrets.MCP_API_KEY }}
